<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6cb5"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5562d"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#fbfbfc"/>

  <text x="36" y="40" font-size="19" fill="#222" font-weight="600">topbit Middleware Onion Model</text>
  <text x="36" y="63" font-size="12.5" fill="#666">Requests travel inward layer by layer, responses travel back outward; next(c) separates the two directions.</text>

  <g transform="translate(320,368)">
    <circle r="292" fill="#eef0f3" stroke="#a9b0bd" stroke-width="1.2"/>
    <circle r="246" fill="#dfe7f5" stroke="#8296bb" stroke-width="1.4"/>
    <circle r="200" fill="#eef0f3" stroke="#a9b0bd" stroke-width="1.2"/>
    <circle r="154" fill="#f5f6f9" stroke="#a9b0bd" stroke-width="1.2"/>
    <circle r="108" fill="#dfe7f5" stroke="#8296bb" stroke-width="1.4"/>
    <circle r="60"  fill="#c9d3ea" stroke="#66799f" stroke-width="1.5"/>

    <text y="276" text-anchor="middle" font-size="14" fill="#555">Final response · setfinal</text>
    <text y="230" text-anchor="middle" font-size="15" fill="#24406e" font-weight="600">Pre middleware · app.pre</text>
    <text y="184" text-anchor="middle" font-size="14" fill="#555">Body receiving</text>
    <text y="138" text-anchor="middle" font-size="14" fill="#555">Body parsing · parseBody</text>
    <text y="92"  text-anchor="middle" font-size="15" fill="#24406e" font-weight="600">Use middleware · app.use</text>
    <text y="-4"  text-anchor="middle" font-size="15.5" fill="#22304d" font-weight="600">Route handler</text>
    <text y="17"  text-anchor="middle" font-size="12" fill="#4d5a78">requestCall</text>
  </g>

  <path d="M 56 104 L 274 322" stroke="#2d6cb5" stroke-width="2.4" fill="none" marker-end="url(#ahi)"/>
  <text x="36" y="92" font-size="13.5" fill="#2d6cb5" font-weight="600">Request</text>

  <path d="M 366 414 L 604 652" stroke="#b5562d" stroke-width="2.4" fill="none" marker-end="url(#aho)"/>
  <text x="536" y="676" font-size="13.5" fill="#b5562d" font-weight="600">Response</text>

  <text x="36" y="700" font-size="12" fill="#888">Route matching and context setup happen outside the onion; an unmatched route returns 404 without entering any middleware.</text>

  <g transform="translate(650,116)">
    <line x1="0" y1="-16" x2="30" y2="-16" stroke="#2d6cb5" stroke-width="2.4"/>
    <text x="40" y="-11" font-size="13" fill="#2d6cb5" font-weight="600">Inbound order</text>
    <text y="16" font-size="12.5" fill="#555">1. Final response layer</text>
    <text y="37" font-size="12.5" fill="#24406e" font-weight="600">2. Pre middleware (registration order)</text>
    <text y="58" font-size="12.5" fill="#555">3. Body receiving</text>
    <text y="79" font-size="12.5" fill="#555">4. Body parsing</text>
    <text y="100" font-size="12.5" fill="#24406e" font-weight="600">5. Use middleware (registration order)</text>
    <text y="121" font-size="12.5" fill="#555">6. Route handler</text>

    <line x1="0" y1="152" x2="30" y2="152" stroke="#b5562d" stroke-width="2.4"/>
    <text x="40" y="157" font-size="13" fill="#b5562d" font-weight="600">Outbound order</text>
    <text y="184" font-size="12.5" fill="#555">Layers unwind in reverse; the final</text>
    <text y="205" font-size="12.5" fill="#555">response layer assembles and sends it</text>

    <text y="247" font-size="14" fill="#333" font-weight="600">Short-circuit</text>
    <text y="272" font-size="12.5" fill="#555">If a layer skips next(c), inner layers</text>
    <text y="293" font-size="12.5" fill="#555">are not run and it unwinds right away</text>

    <text y="335" font-size="14" fill="#333" font-weight="600">Selective execution</text>
    <text y="360" font-size="12.5" fill="#555">Middleware can be scoped by group, method</text>
    <text y="381" font-size="12.5" fill="#555">or route name; non-matching layers are skipped</text>

    <rect x="-6" y="405" width="264" height="94" rx="5" fill="#f2f3f6" stroke="#ccd0da"/>
    <text y="431" font-size="12" fill="#555" font-family="ui-monospace,Menlo,Consolas,monospace">async (c, next) =&gt; {</text>
    <text y="451" font-size="12" fill="#2d6cb5" font-family="ui-monospace,Menlo,Consolas,monospace">  // runs on the way in</text>
    <text y="471" font-size="12" fill="#555" font-family="ui-monospace,Menlo,Consolas,monospace">  await next(c)</text>
    <text y="491" font-size="12" fill="#b5562d" font-family="ui-monospace,Menlo,Consolas,monospace">  // runs on the way out</text>
  </g>
</svg>
